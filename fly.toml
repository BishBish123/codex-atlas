# fly.toml — Fly.io deploy manifest for codex-atlas
# Replace "codex-atlas-REPLACE-ME" with your chosen app name before running
# `fly launch` or `fly deploy`.
app = "codex-atlas-REPLACE-ME"
primary_region = "ord"

[build]
  # Fly.io picks up the repo-root Dockerfile automatically.

[env]
  PORT = "8000"
  # ATLAS_STORE defaults to "memory" in the server; set to "pgvector" and
  # supply ATLAS_PG_DSN via `fly secrets set` for the pgvector backend.
  ATLAS_STORE = "memory"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  # 1024 MB — bumped from the 512 MB default because codex-atlas indexing
  # loads the full call graph + chunk store into RAM; 512 MB OOMs on
  # mid-size repos (>30K chunks).
  memory_mb = 1024

[[services.tcp_checks]]
  interval = "15s"
  timeout = "2s"
  grace_period = "10s"
