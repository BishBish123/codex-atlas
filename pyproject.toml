[project]
name = "codex-atlas"
version = "0.1.0"
description = "Agentic GraphRAG over a codebase: vector + graph hybrid retrieval with reflection, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bishara Mekhaeil" }]
keywords = ["mcp", "graphrag", "rag", "code-search", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    # Numerics + data
    "numpy>=1.26,<3",
    "pyarrow>=15",
    # Graph
    "networkx>=3.3",
    # Storage
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # MCP
    "fastmcp>=2.0",
    "pydantic>=2.7",
    # CLI + UX
    "typer>=0.12",
    "rich>=13.7",
    # HTTP
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/BishBish123/codex-atlas"
Repository = "https://github.com/BishBish123/codex-atlas"

[project.scripts]
atlas = "codex_atlas.cli:app"
atlas-mcp = "codex_atlas.mcp_server:main"

[project.optional-dependencies]
embed = [
    # torch dropped macOS x86_64 wheels at 2.3, gated for portability.
    "sentence-transformers>=3.0,<4 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
    "torch>=2.2,<2.8 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
]
real = [
    "langfuse>=2.50",
    # LangGraph orchestration framework for the optional langgraph agent backend.
    # Latest stable: 1.1.10 (2026-04-27, pypi.org/project/langgraph/).
    "langgraph>=0.2",
    # Neo4j async driver for the optional graph backend.
    # Latest stable: 6.2.0 (2026-05-04, pypi.org/project/neo4j/).
    "neo4j>=5.20",
    # RAGAS eval framework for the optional LLM-judge metrics.
    # Latest stable: 0.2.x (pypi.org/project/ragas/).
    "ragas>=0.2",
]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF", "ASYNC", "S"]
ignore = ["PLR0913", "PLR2004", "E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "S608", "ASYNC"]
# test_examples.py inserts a sys.path entry before importing mcp_client (not on PYTHONPATH)
"tests/test_examples.py" = ["I001"]
"src/codex_atlas/cli.py" = ["B008", "ASYNC240", "PLC0415"]  # write_text inside asyncio.run is OK; calibrate uses lazy import
# Table name comes from a typed config field, not user input.
"src/codex_atlas/store.py" = ["S608"]
"src/codex_atlas/store/_core.py" = ["S608"]
# Judge package uses lazy httpx imports so the module loads without httpx installed.
"src/codex_atlas/judge/llm.py" = ["PLC0415"]
"src/codex_atlas/judge/factory.py" = ["PLC0415"]
"src/codex_atlas/judge/calibration.py" = ["PLC0415"]
# Observability adapter imports langfuse lazily to avoid hard-dep at module load.
"src/codex_atlas/observability/langfuse.py" = ["PLC0415"]
# RAGAS package uses lazy imports for the optional ragas library and datasets.
# BLE001: broad-except in library wrapper is intentional — any ragas/datasets error falls back.
"src/codex_atlas/eval/ragas/library.py" = ["PLC0415", "BLE001"]
"src/codex_atlas/eval/ragas/factory.py" = ["PLC0415"]
# RAGAS tests use lib_mod import inside methods for monkey-patching.
"tests/test_ragas.py" = ["PLC0415"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that touch a real Postgres / LLM API",
    "slow: tests that take more than ~1s",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]
