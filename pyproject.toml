[project]
name = "codex-atlas"
version = "0.1.0"
description = "Agentic GraphRAG over a codebase: vector + graph hybrid retrieval with reflection, exposed as an MCP server."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Bishara Mekhaeil" }]
keywords = ["mcp", "graphrag", "rag", "code-search", "langgraph", "anthropic", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    # Numerics + data
    "numpy>=1.26,<3",
    "pyarrow>=15",
    # Graph
    "networkx>=3.3",
    # Storage
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # MCP
    "fastmcp>=2.0",
    "pydantic>=2.7",
    # Agent loop
    "langgraph>=0.2",
    # CLI + UX
    "typer>=0.12",
    "rich>=13.7",
    # HTTP
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/BishBish123/codex-atlas"
Repository = "https://github.com/BishBish123/codex-atlas"

[project.scripts]
atlas = "codex_atlas.cli:app"
atlas-mcp = "codex_atlas.mcp_server:main"

[project.optional-dependencies]
embed = [
    # torch dropped macOS x86_64 wheels at 2.3, gated for portability.
    "sentence-transformers>=3.0,<4 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
    "torch>=2.2,<2.8 ; (sys_platform == 'darwin' and platform_machine == 'arm64') or sys_platform == 'linux' or sys_platform == 'win32'",
]

dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-networkx",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_atlas"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "RUF", "ASYNC", "S"]
ignore = ["PLR0913", "PLR2004", "E501", "S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "S608", "ASYNC"]
"src/codex_atlas/cli.py" = ["B008", "ASYNC240"]  # write_text inside asyncio.run is OK
# Table name comes from a typed config field, not user input.
"src/codex_atlas/store.py" = ["S608"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config", "--showlocals"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests that touch a real Postgres / LLM API",
    "slow: tests that take more than ~1s",
]
filterwarnings = ["error", "ignore::DeprecationWarning"]
